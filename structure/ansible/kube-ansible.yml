---
- hosts: control_plane,workers
  become: yes
  gather_facts: true
  vars:
    k8s_version: "1.34*"

  tasks:
    - name: Create containerd config file
      file:
        path: "/etc/modules-load.d/containerd.conf"
        state: "touch"

    - name: Add conf for containerd
      blockinfile:
        path: "/etc/modules-load.d/containerd.conf"
        block: |
          overlay
          br_netfilter

    - name: modprobe
      shell: |
        sudo modprobe overlay
        sudo modprobe br_netfilter

    - name: Set system configurations for Kubernetes networking
      file:
        path: "/etc/sysctl.d/99-kubernetes-cri.conf"
        state: "touch"

    - name: Add conf for containerd
      blockinfile:
        path: "/etc/sysctl.d/99-kubernetes-cri.conf"
        block: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply new settings
      command: sudo sysctl --system

    - name: install containerd
      shell: |
        sudo apt-get update && sudo apt-get install -y containerd
        sudo mkdir -p /etc/containerd
        sudo containerd config default | sudo tee /etc/containerd/config.toml
        sudo systemctl restart containerd

    - name: Remove swapfile from /etc/fstab
      mount:
        name: swap
        fstype: swap
        state: absent

    - name: Disable swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: install python3-debian
      apt: name=python3-debian state=present

    - name: apt update
      shell: |
        apt update
        apt-get install -y apt-transport-https ca-certificates curl gpg

    - name: создание директории для ключей
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: "0644"
        force: false

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
        filename: kubernetes
        state: present
        update_cache: yes

    - name: install kubelet
      apt:
        name: kubelet={{ k8s_version }}
        state: present
        update_cache: true
        force: yes

    - name: install kubeadm
      apt:
        name: kubeadm={{ k8s_version }}
        state: present
        force: yes

    - name: Restart service kubelet
      ansible.builtin.systemd_service:
        state: restarted
        daemon_reload: true
        name: kubelet

- hosts: control_plane
  become: yes
  tasks:
    - name: install kubectl
      apt:
        name: kubectl={{ k8s_version }}
        state: present
        force: yes

    - name: install helm
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh

- hosts: control1
  become: yes
  gather_facts: true

  tasks:
    - name: Initialize the Kubernetes cluster using kubeadm # инициализируем кластер
      become_user: root
      command: >
        kubeadm init
        --control-plane-endpoint {{ hostvars[groups['lb'][0]]['ansible_host'] }}
        --upload-certs
        --pod-network-cidr 10.244.0.0/16

    - name: get permission # даем доступ для обычного пользователя
      shell: "{{ item }}"
      become_user: ubuntu
      with_items:
        - mkdir -p $HOME/.kube
        - sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        - sudo chown $(id -u):$(id -g) $HOME/.kube/config

    - name: Install calico pod network # устанавливаем calico pod network
      become: false
      shell: "{{ item }}"
      with_items:
        - curl https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml -O
        - kubectl apply -f calico.yaml

    - name: Generate join command # показываем команду с добавлением ноды и записываем ее в переменную
      become_user: ubuntu
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Copy join command to local file # создаем локальный файл и добавляем туда переменную для присоединения ноды
      local_action: copy content="{{ join_command.stdout_lines[0] }}" dest="./join-command"

- hosts: control_plane,workers
  become: yes
  gather_facts: true

  tasks:
    - name: Copy the join command to server location # копируем файл с нашей комадной для присоединения ноды на сервер, меняем расширение и добавляем права на исполнение
      copy: src=join-command dest=/tmp/join-command.sh mode=0777

    - name: Join the node to cluster # запускаем наш файл
      command: sh /tmp/join-command.sh

- name: Install haproxy
  hosts: lb
  become: true
  gather_facts: true
  vars:
    my_file: /etc/haproxy/haproxy.cfg
    my_template: templates/haproxy.j2
  tasks:
    - name: gather facts from the control_plane
      tags: ["control_plane"]
      setup:
      delegate_to: "{{item}}"
      delegate_facts: True
      with_items: "{{groups['control_plane']}}"
    - name: install haproxy
      apt:
        name: haproxy
        state: present
        update_cache: true
        force: yes
    - name: Stop haproxy service
      service:
        name: haproxy
        state: stopped
    - name: Create "{{ my_file }}"
      ansible.builtin.template:
        src: "{{ my_template }}"
        dest: "{{ my_file }}"
        owner: root
        group: root
        mode: "0644"
    - name: start haproxy service
      service:
        name: haproxy
        state: started
